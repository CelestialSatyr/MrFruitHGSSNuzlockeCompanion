<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1961 1316" role="img" aria-labelledby="title desc">
  <title id="title">Johto region map background</title>
  <desc id="desc">A locally hosted topographic Johto map backdrop for the interactive HeartGold and SoulSilver encounter planner.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#193b4a"/>
      <stop offset="0.58" stop-color="#0c3346"/>
      <stop offset="1" stop-color="#082a3c"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f704f"/>
      <stop offset="0.48" stop-color="#485e43"/>
      <stop offset="1" stop-color="#394d3a"/>
    </linearGradient>
    <linearGradient id="highland" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d7768"/>
      <stop offset="1" stop-color="#514d45"/>
    </linearGradient>
    <radialGradient id="forest" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#4e6f46"/>
      <stop offset="1" stop-color="#314833"/>
    </radialGradient>
    <pattern id="forestDots" width="34" height="30" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="8" r="5" fill="#738766" opacity=".18"/>
      <circle cx="23" cy="18" r="7" fill="#1f3d2c" opacity=".26"/>
      <circle cx="32" cy="3" r="4" fill="#91a37d" opacity=".13"/>
    </pattern>
    <filter id="texture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="3" seed="22" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="soft">
        <feFuncA type="table" tableValues="0 .12"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="soft" mode="soft-light"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#02070b" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1961" height="1316" fill="url(#sea)"/>
  <path d="M0 820 C120 785 185 770 267 778 C350 786 410 833 493 835 C584 837 624 786 700 782 C792 778 877 826 948 850 C1030 878 1132 868 1210 831 C1300 787 1354 706 1433 686 C1523 663 1640 697 1715 739 C1803 788 1884 792 1961 766 L1961 1316 L0 1316 Z" fill="#0d2f41" opacity=".48"/>

