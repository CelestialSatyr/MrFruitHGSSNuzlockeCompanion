    <path d="M0 616 C79 594 159 604 225 641 C276 670 304 729 274 781 C244 831 176 844 112 828 C58 815 20 782 0 752 Z" fill="url(#land)" stroke="#8b8b74" stroke-opacity=".38" stroke-width="6" filter="url(#texture)"/>
