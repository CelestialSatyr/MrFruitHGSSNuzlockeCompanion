  <g opacity=".45">
    <circle cx="1538" cy="958" r="13" fill="#f1d88b"/><circle cx="1160" cy="848" r="13" fill="#d4dce4"/>
    <circle cx="610" cy="414" r="14" fill="#d4dce4"/><circle cx="303" cy="446" r="16" fill="#f1d88b"/>
    <circle cx="690" cy="522" r="13" fill="#d4dce4"/><circle cx="688" cy="230" r="13" fill="#f1d88b"/>
  </g>

  <rect x="18" y="18" width="1925" height="1280" rx="26" fill="none" stroke="#eef1e8" stroke-opacity=".1" stroke-width="3"/>
</svg>
